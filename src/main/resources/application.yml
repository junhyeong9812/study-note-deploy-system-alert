server:
  port: 16000
spring:
  application:
    name: alert
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
alert:
  secret: ${ALERT_SECRET:}                      # 사건 접수·조회용 서버 간 비밀값 — 비어 있으면 전부 거절
  discord-webhook-url: ${DISCORD_WEBHOOK_URL:}  # 비밀값 — 서버 .env 에만
  slack-webhook-url: ${SLACK_WEBHOOK_URL:}
  mail-from: ${MAIL_FROM:}
  mail-to: ${MAIL_TO:}
  data-path: ${ALERT_DATA_PATH:data/alert.db}
  monitors-file: ${ALERT_MONITORS_FILE:classpath:monitors.yml}
