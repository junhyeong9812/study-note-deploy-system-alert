# 알림 서버 — 두 자리(blue·green) 중 하나만 뜨고 nginx 가 그쪽으로 보낸다(무중단 배포, ci-cd agent 가 전환).
# 처음 올릴 때와 수동 조작은 ci-cd 저장소 README 의 "무중단 배포" 절을 따른다.
x-alert-environment: &alert-environment
  ALERT_DATA_PATH: /data/alert.db
  SERVER_NAME: alert
  # 감시·발송은 프록시가 실제로 보내는 자리 하나만 한다 — 각 자리가 매 바퀴 이 주소의 X-Deploy-Slot 을 본다
  ALERT_SLOT_PROBE_URL: http://nginx:16000/health

x-alert: &alert
  build: .
  image: alert-app:${IMAGE_TAG:-local}   # ci-cd: CI 가 커밋 태그로 빌드, CD 가 그 태그로 교체
  env_file: .env                          # 채널 주소·비밀값·감시 대상 주소 — 서버에만 있다(.env.example 참고)
  volumes:
    - ./data:/data                        # 기록(SQLite) — 두 자리가 같은 파일을 본다
  healthcheck:
    # localhost 금지 — 컨테이너 안에서 ::1로 풀려 IPv4 바인딩 서버가 unhealthy로 찍힘
    test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:16000/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
  restart: unless-stopped
  stop_grace_period: 30s

services:
  alert-blue:
    <<: *alert
    profiles: ["blue"]           # 이름을 지정해야만 뜬다 — `docker compose up -d` 가 두 자리를 한꺼번에 띄우지 않게
    container_name: alert-app-blue
    environment:
      <<: *alert-environment
      ALERT_SLOT: blue
    ports:
      - "127.0.0.1:16001:16000"    # agent 의 자리별 헬스 확인·정리 알림용
  alert-green:
    <<: *alert
    profiles: ["green"]
    container_name: alert-app-green
    environment:
      <<: *alert-environment
      ALERT_SLOT: green
    ports:
      - "127.0.0.1:16002:16000"

  nginx:
    image: nginx:1.27-alpine
    container_name: alert-nginx
    ports:
      - "${BIND_ADDR:?set-in-env}:16000:16000"   # LAN 에만 연다 — 사건 접수는 다른 서버와 front 중계가 부른다
    volumes:
      - ./deploy/active:/etc/nginx:ro            # nginx 가 읽는 것은 git 밖의 활성 디렉토리뿐
    restart: unless-stopped
    logging:   # 접속 기록(통신 규약 v1)이 표준 출력으로 가므로 크기를 묶는다 — 에이전트는 json-file 을 도커 API 로 읽는다
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
